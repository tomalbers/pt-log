<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E78"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PT Log">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg">
<title>PT Log</title>
<style>
:root{--b:#1F4E78;--bl:#e8f0f8;--g:#15803d;--r:#b91c1c;--t:#0f172a;--m:#64748b;--bg:#f1f5f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;min-width:44px;height:44px;font-size:20px}
main{padding:12px 12px 100px;max-width:700px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:12px 0 6px;color:var(--m)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--b);color:#fff;font-size:18px;font-weight:600;padding:14px;margin:8px 0;cursor:pointer}
.btn.sec{background:var(--bl);color:var(--b)}.btn.red{background:#fee2e2;color:var(--r)}.btn.grn{background:var(--g)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.list button.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e2e8f0;padding:16px 4px;font-size:18px}
.list button.item:last-child{border-bottom:0}.sub{color:var(--m);font-size:14px}
label{display:block;font-size:14px;color:var(--m);margin:8px 0 4px}
input,select,textarea{width:100%;font-size:18px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--t)}
textarea{min-height:60px;font-size:16px}
.ex h2{display:flex;justify-content:space-between;gap:6px}
.prev{background:var(--bl);border-radius:8px;padding:6px 10px;font-size:15px;margin:4px 0 8px}
.hint{background:#dcfce7;color:var(--g);font-weight:700;border-radius:8px;padding:6px 10px;margin:4px 0 8px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:8px}
.set .n{font-weight:700;color:var(--m);text-align:center}
.f{display:flex;flex-direction:column;align-items:stretch}.f small{font-size:12px;color:var(--m);text-align:center}
.st{display:flex}.st button{width:34px;border:0;background:#e2e8f0;font-size:22px;font-weight:700;color:var(--b)}
.st button:first-child{border-radius:10px 0 0 10px}.st button:last-child{border-radius:0 10px 10px 0}
.st input{border-radius:0;text-align:center;padding:10px 0;min-width:0;font-weight:600;border-left:0;border-right:0;height:48px}
.mini{display:flex;gap:8px}.mini button{flex:1;border:0;background:#f1f5f9;border-radius:10px;padding:10px;font-size:15px;color:var(--b)}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.score button{border:0;background:#e2e8f0;border-radius:8px;height:40px;font-size:16px;font-weight:600}
.score button.on{background:var(--b);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;border-radius:10px;padding:12px;font-size:16px;background:#e2e8f0}.tabs button.on{background:var(--b);color:#fff}
.sch{display:flex;align-items:center;gap:6px;border-bottom:1px solid #e2e8f0;padding:6px 0}.sch span{flex:1;font-size:16px}
.sch button{border:0;background:#f1f5f9;border-radius:8px;width:40px;height:40px;font-size:18px}
canvas{width:100%;height:220px;display:block;touch-action:pan-y}.cwrap{position:relative}.tip{position:absolute;pointer-events:none;background:#0f172a;color:#fff;font-size:13px;padding:6px 8px;border-radius:8px;white-space:nowrap;z-index:3;display:none}.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--m);margin-bottom:4px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.rti{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e2e8f0}.rti:last-child{border-bottom:0}.rti span{flex:1;font-size:16px}.rti.dn span{color:var(--m);text-decoration:line-through}.ck{width:36px;height:36px;border-radius:10px;border:2px solid var(--b);background:#fff;color:#fff;font-size:20px;font-weight:700;flex:none}.rti.dn .ck{background:var(--g);border-color:var(--g)}.tm{border:0;background:var(--bl);color:var(--b);border-radius:10px;height:40px;padding:0 10px;font-size:15px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}.tm.run{background:var(--b);color:#fff}.rt h2{display:flex;justify-content:space-between}table.plan tr[data-w]{cursor:pointer}table.plan tr.now{background:#dbeafe;outline:2px solid var(--b)}table.plan tr.dl td:nth-child(2){color:#92400e}.phase{background:var(--b);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}.phase b{font-size:18px}.empty{padding:40px 10px;text-align:center;color:var(--m);font-size:15px;background:#f8fafc;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid #e2e8f0;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:9}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.1)}
.foot .btn{margin:0;max-width:676px;margin:0 auto}
</style></head><body>
<header><button id="back" aria-label="Terug" style="display:none">‹</button><h1 id="title">PT Log</h1><button id="menu" aria-label="Instellingen">⚙︎</button></header>
<main id="app"></main>
<script>
'use strict';
const LIB={"Goblet squat":"8-12","Dumbbell Romanian deadlift":"8-12","Dumbbell floor press":"8-12","One-arm dumbbell row":"8-12 p/k","Lateral raise":"10-15","Dead bug":"10-15 p/k","Reverse lunge":"8-12 p/k","Dumbbell glute bridge":"10-15","Staande dumbbell shoulder press":"8-12","Bent-over dumbbell row (2 armen)":"8-12","Push-up":"8-12","Plank":"30-45 s","Dumbbell sumo squat":"8-12","Single-leg Romanian deadlift":"8-12 p/k","Dumbbell floor fly":"10-15","Dumbbell pullover (vloer)":"10-15","Reverse fly (voorovergebogen)":"10-15","Side plank":"20-40 s p/k","Touwspringen (HIIT)":"30 s","Dumbbell swing (HIIT)":"30 s"};
const BASE={A:["Goblet squat","Dumbbell Romanian deadlift","Dumbbell floor press","One-arm dumbbell row","Lateral raise","Dead bug"],
B:["Reverse lunge","Dumbbell glute bridge","Staande dumbbell shoulder press","Bent-over dumbbell row (2 armen)","Push-up","Plank"],
C:["Dumbbell sumo squat","Single-leg Romanian deadlift","Dumbbell floor fly","Dumbbell pullover (vloer)","Reverse fly (voorovergebogen)","Side plank"]};
const KEY='ptlog-data-v1';
let D=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.clients)return d}catch(e){}return{clients:[],sessions:[],draft:null,lib:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>{const[y,m,d]=s.split('-');return `${+d}-${+m}-${y}`};
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const allLib=()=>Object.assign({},LIB,D.lib||{});
function defSchema(){const s={};for(const k in BASE)s[k]=BASE[k].map(n=>({n,r:LIB[n]}));return s}
function trainings(c){return c.plan==='3x'?['A','B','C']:['A','B']}
function weekOf(c,date){const a=new Date(c.start+'T12:00'),b=new Date(date+'T12:00');return Math.max(1,Math.floor((b-a)/864e5/7)+1)}
function topRep(r){const m=String(r||'').match(/(\d+)\s*-\s*(\d+)/);return m?+m[2]:(String(r).match(/\d+/)?+String(r).match(/\d+/)[0]:null)}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function clientSessions(cid){return D.sessions.filter(s=>s.clientId===cid).sort((a,b)=>(a.date+a.t).localeCompare(b.date+b.t))}
function lastEx(cid,name,excludeId){const ss=clientSessions(cid).filter(s=>s.id!==excludeId);for(let i=ss.length-1;i>=0;i--){const e=ss[i].ex.find(x=>x.n===name&&x.sets.some(st=>st.reps!=null||st.kg!=null));if(e)return{s:ss[i],e}}return null}
function prevText(e){if(!e)return'';const kgs=[...new Set(e.sets.map(s=>s.kg).filter(v=>v!=null))];const kg=kgs.length===1?kgs[0]+'kg ':'';
 return kg+e.sets.map(s=>(kgs.length>1&&s.kg!=null?s.kg+'kg×':'')+(s.reps??'-')+(s.rir!=null?'@'+s.rir:'')).join('/')}
function needsUp(e){const top=topRep(e.r);if(!top||!e.sets.length)return false;return e.sets.every(s=>s.reps!=null&&s.reps>=top&&s.rir!=null&&s.rir>=2)}
function vol(e){return e.sets.reduce((a,s)=>a+(s.kg||0)*(s.reps||0),0)}

const RT={wu:[["Touwspringen licht",120],["Cat-cow",30],["World's greatest stretch (per kant)",60],["Heupcirkels",30],["Armcirkels",30],["Glute bridge (lichaamsgewicht)",30],["Bodyweight squats",30],["1 lichte opwarmset op de eerste oefening",0]],
cd:[["Rustig wandelen of licht touwspringen",180],["Rustig ademhalen (4 in, 6 uit)",60]],
st:[["Hamstring stretch",50],["Quadriceps stretch",50],["Heupbuiger stretch",50],["Bilspieren (figure-4)",50],["Borst stretch",50],["Lats / child's pose",40]]};
const RTN={wu:'Warming-up (5-8 min)',cd:'Cooling-down (3-5 min)',st:'Stretchen (5 min, 20-30 s per kant)'};
function routine(c){if(!c.routine){c.routine={};}for(const k in RT)if(!c.routine[k])c.routine[k]=RT[k].map(([n,sec])=>({n,sec}));return c.routine}
function mmss(x){return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}
function rtCard(s,k){const L=s.rt[k];const d=L.filter(x=>x.done).length;return `<div class="card rt" data-k="${k}"><h2><span>${RTN[k]}</span><span class="sub">${d}/${L.length}</span></h2>${L.map((x,i)=>`<div class="rti${x.done?' dn':''}" data-i="${i}"><button class="ck" aria-label="Afvinken">${x.done?'✓':''}</button><span>${esc(x.n)}</span>${x.sec?`<button class="tm">⏱ ${mmss(x.sec)}</button>`:''}</div>`).join('')}</div>`}
let rtTimer=null;
function bindRt(s,a){a.querySelectorAll('.rt').forEach(card=>{const k=card.dataset.k;card.querySelectorAll('.rti').forEach(r=>{const it=s.rt[k][+r.dataset.i];
 r.querySelector('.ck').onclick=function(){it.done=!it.done;save();r.classList.toggle('dn',it.done);this.textContent=it.done?'✓':'';card.querySelector('h2 .sub').textContent=s.rt[k].filter(x=>x.done).length+'/'+s.rt[k].length};
 const tb=r.querySelector('.tm');if(tb)tb.onclick=()=>{if(rtTimer){clearInterval(rtTimer.id);const same=rtTimer.b===tb;rtTimer.b.textContent='⏱ '+mmss(rtTimer.sec);rtTimer.b.classList.remove('run');rtTimer=null;if(same)return}
  let left=it.sec;tb.classList.add('run');tb.textContent='⏸ '+mmss(left);const id=setInterval(()=>{left--;if(!document.body.contains(tb)){clearInterval(id);rtTimer=null;return}tb.textContent='⏸ '+mmss(Math.max(0,left));
   if(left<=0){clearInterval(id);rtTimer=null;navigator.vibrate&&navigator.vibrate([200,100,200]);toast('Klaar: '+it.n);tb.classList.remove('run');tb.textContent='⏱ '+mmss(it.sec);if(!it.done)r.querySelector('.ck').click()}},1000);rtTimer={id,b:tb,sec:it.sec}}})})}
let stack=[];
function go(v,p,replace){if(!replace&&cur)stack.push(cur);cur={v,p};render();window.scrollTo(0,0)}
let cur=null;
$('#back').onclick=()=>{if(cur&&cur.v==='session'&&!confirm('Training verlaten? Je invoer blijft bewaard als concept.'))return;cur=stack.pop()||{v:'home'};render()};
$('#menu').onclick=()=>go('settings');
function head(t,back){$('#title').textContent=t;$('#back').style.display=back?'':'none'}
function render(){const a=$('#app');const V={home,client,editClient,schema,session,exStats,settings,history:histView,progress,clientAdmin,admin,planning}[cur.v];a.innerHTML='';V(a,cur.p||{})}

function home(a){head('PT Log',false);stack=[];
 let h='';
 if(D.draft){const c=D.clients.find(x=>x.id===D.draft.clientId);if(c)h+=`<div class="card"><h2>Training bezig</h2><div class="sub">${esc(c.name)} · Training ${D.draft.training} · ${fmtD(D.draft.date)}</div><button class="btn grn" id="resume">Verder met training</button></div>`}
 h+=`<div class="card"><h2>Klanten</h2><div class="list">${D.clients.length?D.clients.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(c=>{const ss=clientSessions(c.id);const l=ss[ss.length-1];return `<button class="item" data-c="${c.id}"><span>${esc(c.name)}<br><span class="sub">Schema ${c.plan} · ${l?'laatst '+fmtD(l.date)+' ('+l.training+')':'nog geen trainingen'}</span></span><span>›</span></button>`}).join(''):'<p class="sub">Nog geen klanten. Voeg je eerste klant toe.</p>'}</div>
 <button class="btn" id="add">+ Nieuwe klant</button><button class="btn sec" id="adm">📋 Administratie</button></div>`;
 a.innerHTML=h;
 a.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>go('client',{id:b.dataset.c}));
 $('#add').onclick=()=>go('editClient',{});$('#adm').onclick=()=>go('admin',{});
 const r=$('#resume');if(r)r.onclick=()=>go('session',{});
}
function editClient(a,p){const c=p.id?D.clients.find(x=>x.id===p.id):null;head(c?'Klant bewerken':'Nieuwe klant',true);
 a.innerHTML=`<div class="card"><label>Naam</label><input id="nm" value="${esc(c?.name)}" autocomplete="off">
 <label>Startdatum (voor weeknummer)</label><input id="st" type="date" value="${c?.start||today()}">
 <label>Schema</label><div class="tabs" id="pl"><button data-p="2x">2x per week (A/B)</button><button data-p="3x">3x per week (A/B/C)</button></div>
 <label>Notities (doel, blessures…)</label><textarea id="no">${esc(c?.notes)}</textarea>
 <button class="btn" id="sv">Opslaan</button>${c?'<button class="btn red" id="del">Klant verwijderen</button>':''}</div>`;
 let plan=c?.plan||'2x';const setP=()=>a.querySelectorAll('#pl button').forEach(b=>b.classList.toggle('on',b.dataset.p===plan));setP();
 a.querySelectorAll('#pl button').forEach(b=>b.onclick=()=>{plan=b.dataset.p;setP()});
 $('#sv').onclick=()=>{const name=$('#nm').value.trim();if(!name){toast('Vul een naam in');return}
  if(c){Object.assign(c,{name,start:$('#st').value||today(),plan,notes:$('#no').value})}else{D.clients.push({id:uid(),name,start:$('#st').value||today(),plan,notes:$('#no').value,schema:defSchema()})}
  save();toast('Opgeslagen');cur=stack.pop();if(!c)cur={v:'client',p:{id:D.clients[D.clients.length-1].id}};render()};
 const d=$('#del');if(d)d.onclick=()=>{if(!confirm(`${c.name} en alle trainingen verwijderen?`))return;D.clients=D.clients.filter(x=>x!==c);D.sessions=D.sessions.filter(s=>s.clientId!==c.id);if(D.draft&&D.draft.clientId===c.id)D.draft=null;save();stack=[];cur={v:'home'};render()};
}
function client(a,p){const c=D.clients.find(x=>x.id===p.id);if(!c){cur={v:'home'};return render()}head(c.name,true);
 const ss=clientSessions(c.id);const wk=weekOf(c,today());
 const nextT=(()=>{const T=trainings(c);const l=ss[ss.length-1];if(!l)return T[0];const i=T.indexOf(l.training);return T[(i+1)%T.length]})();
 a.innerHTML=`<div class="card"><h2>Training starten</h2><div class="sub">${(()=>{const b=blockFor(c,today());const w=b&&bWeek(b,today());return w?`Week ${w}/${b.weeks.length} · ${esc(b.weeks[w-1].ph)}`:(curBlock(c)?'Blok afgelopen — start een nieuw blok in Planning':'Week '+wk)})()} · volgende: Training ${nextT}</div>
 <div class="row">${trainings(c).map(t=>`<button class="btn ${t===nextT?'':'sec'}" data-t="${t}">${t}</button>`).join('')}</div></div>
 ${adminCard(c)}<div class="card"><div class="row"><button class="btn" id="prog">📈 Voortgang</button><button class="btn" id="plan">🗓 Planning</button></div></div>
 <div class="card"><h2>Voortgang per oefening</h2><div class="list">${exNames(c).map(n=>`<button class="item" data-e="${esc(n)}"><span>${esc(n)}</span><span class="sub">${statLine(c.id,n)} ›</span></button>`).join('')}</div></div>
 <div class="card"><h2>Geschiedenis</h2>${ss.length?'<div class="list">'+ss.slice().reverse().map(s=>`<button class="item" data-s="${s.id}"><span>${fmtD(s.date)} · Training ${s.training}<br><span class="sub">Week ${s.week} · spierpijn ${s.sp??'-'} · energie ${s.en??'-'}</span></span><span>›</span></button>`).join('')+'</div>':'<p class="sub">Nog geen trainingen gelogd.</p>'}</div>
 <div class="card"><button class="btn sec" id="sch">Schema aanpassen</button><button class="btn sec" id="ed">Klantgegevens</button>${c.notes?`<p class="sub">${esc(c.notes)}</p>`:''}</div>`;
 a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startSession(c,b.dataset.t));
 a.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>go('exStats',{id:c.id,n:b.dataset.e}));
 a.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go('history',{id:b.dataset.s}));
 bindAdminCard(c);$('#plan').onclick=()=>go('planning',{id:c.id});$('#prog').onclick=()=>go('progress',{id:c.id});$('#sch').onclick=()=>go('schema',{id:c.id,t:'A'});$('#ed').onclick=()=>go('editClient',{id:c.id});
}
function exNames(c){const s=new Set();trainings(c).forEach(t=>c.schema[t].forEach(e=>s.add(e.n)));clientSessions(c.id).forEach(x=>x.ex.forEach(e=>s.add(e.n)));return[...s]}
function statLine(cid,n){const l=lastEx(cid,n);if(!l)return'';const mx=Math.max(...l.e.sets.map(s=>s.kg||0));return mx?mx+'kg':''}
function startSession(c,t){
 if(D.draft&&!confirm('Er staat nog een niet-afgeronde training open. Die vervangen?'))return;
 const date=today(),week=weekOf(c,date);{const cb=curBlock(c);if(cb&&date>bEnd(cb)&&!c._askedNB){c._askedNB=1;if(confirm('Het trainingsblok is afgelopen. Nu een nieuw blok plannen? (Oude blok blijft bewaard)')){go('planning',{id:c.id});return}}}
 const b=blockFor(c,date),bw=b&&bWeek(b,date),W=bw&&b.weeks[bw-1];
 const ex=c.schema[t].map(e0=>{const nm=swapName(b,bw,e0.n);const l=lastEx(c.id,nm)||lastEx(c.id,e0.n);let n=l?l.e.sets.length:(week<=2?2:3);if(W)n=parseInt(W.sets)||n;
  const rr=W?parseInt(String(W.rir).split('-').pop()):null;const tr=W&&!W.dl?parseInt(W.reps):null;
  const sets=Array.from({length:Math.max(1,n)},(_,i)=>{const ps=l&&(l.e.sets[i]||l.e.sets[l.e.sets.length-1]);let kg=ps?ps.kg:null;if(W&&W.dl&&kg)kg=Math.round(kg*0.9*2)/2;return{kg,reps:ps?ps.reps:(tr||null),rir:W?rr:(ps?ps.rir:null)}});
  return{n:nm,r:W&&!W.dl?W.reps:e0.r,sets,note:W&&W.dl&&l?'Deload: −10% kg':''}});
 const R=routine(c);D.draft={id:uid(),clientId:c.id,training:t,date,week:bw||week,ex,blockId:b?b.id:null,bw:bw||null,phase:W?W.ph:null,plan:W?{...W,len:b.weeks.length}:null,sp:null,en:null,note:'',rt:Object.fromEntries(Object.keys(RT).map(k=>[k,R[k].map(x=>({n:x.n,sec:x.sec,done:false}))]))};save();go('session',{});
}
function stepper(cls,val,step,lab){return `<div class="f"><div class="st"><button data-d="-${step}" tabindex="-1">−</button><input class="${cls}" inputmode="decimal" type="text" value="${val??''}" placeholder="${lab}"><button data-d="${step}" tabindex="-1">+</button></div><small>${lab}</small></div>`}

 for(let k=0,f=c.pkg.start;f<=last;k++,f=addD(f,28)){const t=addD(f,27);const used=ss.filter(s=>s.date>=f&&s.date<=t);P.push({nr:k+1,from:f,to:t,used:used.length,dates:used,total:c.pkg.size,left:Math.max(0,c.pkg.size-used.length),over:Math.max(0,used.length-c.pkg.size)})}return P}
